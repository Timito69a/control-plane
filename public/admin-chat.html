<div id="admin-chat-container" style="display:flex;height:100%;">
  
  <div style="flex:1;display:flex;flex-direction:column;">
    
    <div id="chat-log" style="flex:1;padding:20px;overflow:auto;background:#f7f9fc;"></div>
    
    <div style="padding:10px;border-top:1px solid #ddd;">
      <input id="chat-input" placeholder="Nachricht eingeben..."
        style="width:80%;padding:10px;">
      <button id="chat-send">Senden</button>
    </div>

  </div>

  <div style="width:300px;border-left:1px solid #ddd;padding:10px;">
    <h4>Kontext</h4>
    <pre id="chat-context"></pre>
  </div>

</div>
